<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Conservation Tracker</title>
  <style>
    /* General Reset and Body Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('https://www.example.com/your-waterbackground.jpg');
      background-size: cover;
      background-position: center;
      color: white;
    }

    /* Header Styles */
    header {
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    header img {
      width: 150px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 20px 0;
      font-weight: bold;
    }

    /* Form Container Styles */
    .form-container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      margin-top: 100px;
      color: black;
    }

    .form-container h2 {
      margin-bottom: 1rem;
      color: #00796b;
      text-align: center;
    }

    .input-field {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .form-button {
      padding: 0.8rem 1.5rem;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
    }

    .form-button:hover {
      background-color: #004d40;
    }

    .links {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #00796b;
      text-align: center;
    }

    .links a {
      text-decoration: none;
      color: #00796b;
    }

    .links a:hover {
      color: #004d40;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      width: 100%;
      position: absolute;
      bottom: 0;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <img src="logo.png" alt="Water Conservation Tracker Logo" width="150">
    <h1>Water Conservation Tracker</h1>
  </header>

  <div class="form-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" class="input-field" placeholder="Email" required>
      <input type="password" id="password" class="input-field" placeholder="Password" required>
      <button type="submit" class="form-button">Login</button>
    </form>
    <div class="links">
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Water Conservation Tracker. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        alert(data.message || (res.ok ? "Login successful" : "Login failed"));
        if (res.ok) {
          if (data && data.user && data.user.id) {
            localStorage.setItem("userId", String(data.user.id));
            localStorage.setItem("userName", data.user.name || "");
          }
          window.location.href = "goal.html";
        }
      } catch (err) {
        alert("Could not reach server. Please start it and try again.");
        console.error(err);
      }
    });
</script>

</body>
</html>
